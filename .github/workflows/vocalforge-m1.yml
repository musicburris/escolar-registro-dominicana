name: VocalForge Apple Silicon M1
on:
  workflow_dispatch:
  push:
    branches: [vocalforge-macos-build]
    paths: ["VocalForgeStudio/**"]

jobs:
  build-and-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: VocalForgeStudio
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string
          test "$(uname -m)" = "arm64"
      - name: Build, test and package
        run: chmod +x Scripts/build-release.sh && Scripts/build-release.sh
      - name: Inspect product
        run: |
          file "dist/VocalForge Studio.app/Contents/MacOS/VocalForgeStudio"
          codesign -dv --verbose=4 "dist/VocalForge Studio.app"
          hdiutil verify dist/VocalForgeStudio-0.2.0-arm64.dmg
      - name: Validate managed neural runtime
        timeout-minutes: 30
        run: |
          ENGINE_TEST="$RUNNER_TEMP/vocalforge-engine-test"
          UV="dist/VocalForge Studio.app/Contents/Resources/tools/uv"
          export UV_PYTHON_INSTALL_DIR="$ENGINE_TEST/python"
          export UV_CACHE_DIR="$ENGINE_TEST/cache"
          "$UV" python install 3.10.16
          "$UV" venv --python 3.10.16 --seed "$ENGINE_TEST/venv"
          "$UV" pip install --python "$ENGINE_TEST/venv/bin/python" -r Resources/engine-requirements.txt
          "$ENGINE_TEST/venv/bin/python" -c "import torch, torchaudio, librosa, transformers; print('torch', torch.__version__); print('mps_built', torch.backends.mps.is_built()); print('mps_available', torch.backends.mps.is_available()); assert torch.backends.mps.is_built()"
          export HF_HOME="$ENGINE_TEST/models"
          export HF_HUB_CACHE="$ENGINE_TEST/models/hub"
          export PYTORCH_ENABLE_MPS_FALLBACK=1
          export VOCALFORGE_DEVICE=cpu
          say -v Samantha -o "$ENGINE_TEST/source.aiff" "I will sing this melody with feeling"
          say -v Daniel -o "$ENGINE_TEST/reference.aiff" "This is the authorized reference voice"
          afconvert -f WAVE -d LEI16@44100 "$ENGINE_TEST/source.aiff" "$ENGINE_TEST/source.wav"
          afconvert -f WAVE -d LEI16@44100 "$ENGINE_TEST/reference.aiff" "$ENGINE_TEST/reference.wav"
          mkdir -p "$ENGINE_TEST/output" "$ENGINE_TEST/dataset"
          cp "$ENGINE_TEST/source.wav" "$ENGINE_TEST/dataset/one.wav"
          cp "$ENGINE_TEST/reference.wav" "$ENGINE_TEST/dataset/two.wav"
          cd "dist/VocalForge Studio.app/Contents/Resources/seed-vc"
          "$ENGINE_TEST/venv/bin/python" inference.py --source "$ENGINE_TEST/source.wav" --target "$ENGINE_TEST/reference.wav" --output "$ENGINE_TEST/output" --diffusion-steps 4 --f0-condition True --fp16 False
          find "$ENGINE_TEST/output" -name '*.wav' -size +1k | grep -q .
          "$ENGINE_TEST/venv/bin/python" train.py --config configs/presets/config_dit_mel_seed_uvit_whisper_base_f0_44k.yml --dataset-dir "$ENGINE_TEST/dataset" --run-name ci_m1_training --batch-size 1 --max-steps 1 --save-every 1 --num-workers 0
          find . -path '*ci_m1_training*' -name '*.pth' -size +1k | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: VocalForgeStudio-0.2.0-AppleSilicon
          path: |
            VocalForgeStudio/dist/VocalForgeStudio-0.2.0-arm64.dmg
            VocalForgeStudio/dist/VocalForgeStudio-0.2.0-arm64.zip
            VocalForgeStudio/dist/SHA256SUMS.txt
          if-no-files-found: error

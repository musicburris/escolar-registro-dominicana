name: VocalForge Apple Silicon M1
on:
  workflow_dispatch:
  push:
    branches: [vocalforge-macos-build]
    paths: ["VocalForgeStudio/**"]

jobs:
  build-and-test:
    runs-on: macos-14
    defaults:
      run:
        working-directory: VocalForgeStudio
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: |
          uname -a
          sysctl -n machdep.cpu.brand_string
          test "$(uname -m)" = "arm64"
      - name: Build, test and package
        run: chmod +x Scripts/build-release.sh && Scripts/build-release.sh
      - name: Inspect product
        run: |
          file "dist/VocalForge Studio.app/Contents/MacOS/VocalForgeStudio"
          codesign -dv --verbose=4 "dist/VocalForge Studio.app"
          hdiutil verify dist/VocalForgeStudio-0.2.0-arm64.dmg
      - name: Validate managed neural runtime
        timeout-minutes: 30
        run: |
          ENGINE_TEST="$RUNNER_TEMP/vocalforge-engine-test"
          UV="dist/VocalForge Studio.app/Contents/Resources/tools/uv"
          export UV_PYTHON_INSTALL_DIR="$ENGINE_TEST/python"
          export UV_CACHE_DIR="$ENGINE_TEST/cache"
          "$UV" python install 3.10.16
          "$UV" venv --python 3.10.16 --seed "$ENGINE_TEST/venv"
          "$UV" pip install --python "$ENGINE_TEST/venv/bin/python" -r Resources/engine-requirements.txt
          "$ENGINE_TEST/venv/bin/python" -c "import torch, torchaudio, librosa, transformers; print('torch', torch.__version__); print('mps_built', torch.backends.mps.is_built()); print('mps_available', torch.backends.mps.is_available()); assert torch.backends.mps.is_built()"
      - uses: actions/upload-artifact@v4
        with:
          name: VocalForgeStudio-0.2.0-AppleSilicon
          path: |
            VocalForgeStudio/dist/VocalForgeStudio-0.2.0-arm64.dmg
            VocalForgeStudio/dist/VocalForgeStudio-0.2.0-arm64.zip
            VocalForgeStudio/dist/SHA256SUMS.txt
          if-no-files-found: error
